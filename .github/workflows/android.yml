name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스에 APK를 올리기 위해 필요
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # packages 를 적어주지 않으면 액션이 기본으로 "tools" 까지 받으려 한다.
      # 그 패키지는 SDK 저장소에서 없어져서 설치가 실패한다(Failed to find package 'tools').
      # 어차피 쓰지 않던 것이라 platform-tools 만 받는다. 플랫폼과 build-tools 는
      # 러너에 이미 있거나 그레이들이 알아서 받는다.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 래퍼 jar(바이너리)를 저장소에 넣지 않기 위해 Gradle을 액션으로 받는다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      # 서명은 그레이들이 아니라 여기서 한다. 키를 바꾸면서도(키 교체, key rotation)
      # 기존 앱 위에 덮어쓰기 설치가 되도록 apksigner 로 두 키를 이어서 서명한다.
      #
      # - personal.jks: 예전 키. 저장소에 공개돼 있어 더는 믿을 수 없다. 덮어쓰기
      #   설치를 이어 주는 데만 쓴다.
      # - rotated.jks.enc: 새 키. 암호화해서 넣어 두었고, 암호는 저장소 비밀 값
      #   SIGNING_PASSWORD 에만 있다.
      #
      # 새 키로 서명된 앱이 한 번 깔리면(안드로이드 9 이상), 그 뒤로는 예전 키로만
      # 서명된 APK 가 이 앱을 덮어쓸 수 없다(lineage 의 rollback 권한이 기본으로 꺼져 있음).
      - name: Sign APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          OLD_PASS: toonshortcut
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          K="$RUNNER_TEMP/keys"
          mkdir -p "$K" out

          # 비밀 값을 아직 안 넣었으면 예전 키로만 서명해서 업데이트는 계속 나가게 한다.
          # 키 교체는 비밀 값을 넣은 다음 빌드부터 적용된다.
          if [ -z "${SIGNING_PASSWORD:-}" ]; then
            echo "::warning::SIGNING_PASSWORD 가 없어 예전 키로만 서명합니다. Settings → Secrets and variables → Actions 에 넣으면 새 키로 바뀝니다."
            "$BT/zipalign" -f -p 4 \
              android/app/build/outputs/apk/release/app-release-unsigned.apk "$K/aligned.apk"
            "$BT/apksigner" sign \
              --ks android/keystore/personal.jks --ks-key-alias personal --ks-pass env:OLD_PASS \
              --v4-signing-enabled false \
              --out out/manhwa-shortcut.apk "$K/aligned.apk"
            rm -rf "$K"
            "$BT/apksigner" verify -v --print-certs out/manhwa-shortcut.apk
            exit 0
          fi

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/keystore/rotated.jks.enc -out "$K/rotated.jks" -pass env:SIGNING_PASSWORD

          "$BT/apksigner" rotate --out "$K/lineage.bin" \
            --old-signer --ks android/keystore/personal.jks --ks-key-alias personal --ks-pass env:OLD_PASS \
            --new-signer --ks "$K/rotated.jks" --ks-key-alias rotated --ks-pass env:SIGNING_PASSWORD

          "$BT/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk "$K/aligned.apk"

          "$BT/apksigner" sign \
            --ks android/keystore/personal.jks --ks-key-alias personal --ks-pass env:OLD_PASS \
            --next-signer --ks "$K/rotated.jks" --ks-key-alias rotated --ks-pass env:SIGNING_PASSWORD \
            --lineage "$K/lineage.bin" --rotation-min-sdk-version 28 \
            --v4-signing-enabled false \
            --out out/manhwa-shortcut.apk "$K/aligned.apk"
          rm -rf "$K"

          "$BT/apksigner" verify -v --print-certs out/manhwa-shortcut.apk
          "$BT/apksigner" lineage --in out/manhwa-shortcut.apk --print-certs
          ls -lh out/

      # 폰에서 받기 편하도록 zip이 아닌 APK 그대로 내려받게 한다.
      # 주소가 항상 같아서 다음 빌드부터는 같은 링크로 최신 버전을 받으면 된다.
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          폰에서 아래 `manhwa-shortcut.apk` 를 눌러 바로 설치하세요.

          설치할 때 "출처를 알 수 없는 앱" 허용을 한 번 물어봅니다.
          기존 앱 위에 덮어써지며 저장한 목록은 그대로 남습니다.
          NOTES
          echo "" >> notes.md
          echo "빌드 커밋: $GITHUB_SHA" >> notes.md

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/manhwa-shortcut.apk \
            --target "$GITHUB_SHA" \
            --title "만화 바로가기 (최신)" \
            --notes-file notes.md

      # 릴리스가 막히는 경우를 대비해 아티팩트도 그대로 남긴다.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-shortcut-apk
          path: out/manhwa-shortcut.apk
          if-no-files-found: error
