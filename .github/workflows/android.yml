name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스에 APK를 올리기 위해 필요
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 래퍼 jar(바이너리)를 저장소에 넣지 않기 위해 Gradle을 액션으로 받는다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/manhwa-shortcut.apk
          ls -lh out/

      # 폰에서 받기 편하도록 zip이 아닌 APK 그대로 내려받게 한다.
      # 주소가 항상 같아서 다음 빌드부터는 같은 링크로 최신 버전을 받으면 된다.
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          폰에서 아래 `manhwa-shortcut.apk` 를 눌러 바로 설치하세요.

          설치할 때 "출처를 알 수 없는 앱" 허용을 한 번 물어봅니다.
          기존 앱 위에 덮어써지며 저장한 목록은 그대로 남습니다.
          NOTES
          echo "" >> notes.md
          echo "빌드 커밋: $GITHUB_SHA" >> notes.md

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/manhwa-shortcut.apk \
            --target "$GITHUB_SHA" \
            --title "만화 바로가기 (최신)" \
            --notes-file notes.md

      # 릴리스가 막히는 경우를 대비해 아티팩트도 그대로 남긴다.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-shortcut-apk
          path: out/manhwa-shortcut.apk
          if-no-files-found: error
